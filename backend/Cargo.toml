[workspace]
members = ["crates/domain", "crates/application", "crates/postgres"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
unicode-normalization = "=0.1.26"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "iot-platform-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
repository-probe = ["dep:sqlx"]
http-server = ["dep:sqlx"]

[[test]]
name = "http_auth"
required-features = ["http-server"]

[[bin]]
name = "repository-probe"
path = "src/bin/repository_probe.rs"
required-features = ["repository-probe"]

[[bin]]
name = "auth-lab"
path = "src/bin/auth_lab.rs"
required-features = ["http-server"]

[dependencies]
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64.workspace = true
iot-domain = { path = "crates/domain" }
iot-application = { path = "crates/application" }
iot-postgres = { path = "crates/postgres" }
argon2 = "=0.5.3"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
hmac = "=0.12.1"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
sqlx = { workspace = true, optional = true }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
