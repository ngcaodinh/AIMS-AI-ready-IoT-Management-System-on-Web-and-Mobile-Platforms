analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - android/**

# Dùng rule tích hợp thay vì tải flutter_lints từ template chưa được duyệt.
linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
